[package]
name = "cliplan"
version = "0.1.0"
edition = "2021"
description = "Passwordless LAN clipboard & file sharing"
license = "MIT"
default-run = "cliplan"

[lib]
name = "cliplan"
path = "src/lib.rs"

[[bin]]
name = "cliplan"
path = "src/main.rs"

[features]
default = []
# Desktop clipboard monitoring agent (V1.1). Disabled by default because it
# pulls in platform clipboard libraries (X11/Wayland on Linux, etc.) that are
# not needed to run ClipLAN purely as a LAN server.
agent = ["arboard"]

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

rusqlite = { version = "0.31", features = ["bundled"] }

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

sha2 = "0.10"
rand = "0.8"
hex = "0.4"

qrcode = "0.14"

clap = { version = "4", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

local-ip-address = "0.6"
futures = "0.3"
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

# Optional: desktop clipboard watcher, only compiled with `--features agent`
arboard = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
